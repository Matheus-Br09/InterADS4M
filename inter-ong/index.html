<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d16" />
    <script>
      // Aplica o tema salvo antes da página aparecer, para não piscar claro e depois escuro.
      try {
        var salvo = localStorage.getItem('theme')
        var escuro = salvo !== null ? salvo === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (escuro) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <title>SOS Tudo pelo Social – Paulista, PE</title>
    <meta
      name="description"
      content="Organização sem fins lucrativos de Paulista-PE que atende pessoas neurodivergentes e suas famílias. Conheça nossos projetos, seja voluntário ou doe por Pix."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="SOS Tudo pelo Social" />
    <meta property="og:title" content="SOS Tudo pelo Social – Paulista, PE" />
    <meta
      property="og:description"
      content="Acolhimento, inclusão e oportunidades em Paulista-PE. Conheça nossos projetos, seja voluntário ou doe por Pix."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
